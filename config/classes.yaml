# CAN-BICS classes, shared by pipeline and web app. Order = legend order.
# comfort per CAN-BICS: high / medium / low / non_conforming

classes:
  - {slug: cycle_track,          label: Cycle track,          comfort: high,           color: "#1b7837"}
  - {slug: bike_path,            label: Bike path,            comfort: high,           color: "#5aae61"}
  - {slug: local_street_bikeway, label: Local street bikeway, comfort: high,           color: "#1a9fb5"}
  - {slug: multi_use_path,       label: Multi-use path,       comfort: medium,         color: "#f28e2b"}
  - {slug: painted_bike_lane,    label: Painted bike lane,    comfort: low,            color: "#d62728"}
  - {slug: gravel_trail,         label: Gravel trail,         comfort: non_conforming, color: "#a47148"}
  - {slug: shared_roadway,       label: Shared roadway,       comfort: non_conforming, color: "#a3a3a3"}
  - {slug: major_shared_roadway, label: Major shared roadway, comfort: non_conforming, color: "#5c5c5c"}

# Fallback for values not listed above.
unknown: {slug: unknown, label: Unknown, comfort: unknown, color: "#888888"}
