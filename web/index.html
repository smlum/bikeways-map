<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bikeways map</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script src="https://unpkg.com/pmtiles@4.5.0/dist/pmtiles.js"></script>
</head>
<body>
  <div id="map"></div>
  <aside id="panel">
    <div class="panel-top">
      <div class="title-row"><h1 id="title"></h1>
        <nav class="tabs" id="panel-tabs"><a href="?" data-panel="map" aria-current="page">Map</a><a href="?panel=table" data-panel="table">Table</a></nav></div>
      <input id="city-search" list="city-list" placeholder="Search a city…" autocomplete="off" aria-label="City">
      <datalist id="city-list"></datalist>
      <div class="seg-toggle" id="views" role="radiogroup" aria-label="Dataset"></div>
    </div>
    <div id="info"></div>
    <div id="table"></div>
  </aside>
  <aside id="issues"></aside>
  <script src="common.js"></script>
  <script src="profile.js"></script>
  <script src="table.js"></script>
  <script src="issues.js"></script>
  <script src="app.js"></script>
</body>
</html>
