# Static demo: deployed from a local machine with the Netlify CLI (web/data/ is generated by the
# pipeline and gitignored, so Netlify can't build it). No issues API: the map shows the issues baked
# into web/data/config.json and hides saving.

[build]
  publish = "web"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
